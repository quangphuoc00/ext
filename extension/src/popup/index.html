<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptionPilot</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        width: 380px; max-height: 600px; margin: 0; padding: 12px;
        font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
        background: #fff; color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #eaeaea; }
        .card { background: #161616; border-color: #2a2a2a !important; }
        input { background: #111; color: #eaeaea; border-color: #2a2a2a; }
      }
      h1 { font-size: 14px; margin: 0; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .muted { color: #888; }
      .row { display: flex; gap: 8px; align-items: center; }
      button {
        padding: 7px 10px; border-radius: 7px; border: 1px solid transparent;
        cursor: pointer; font-size: 13px; font-weight: 600;
      }
      button.primary { background: #2563eb; color: #fff; }
      button.ghost { background: transparent; border-color: #ccc; color: inherit; }
      button:disabled { opacity: .5; cursor: default; }
      input {
        width: 100%; padding: 7px 8px; border: 1px solid #ccc; border-radius: 7px; margin: 3px 0;
      }
      .card { border: 1px solid #e5e5e5; border-radius: 9px; padding: 8px 10px; margin: 8px 0; }
      .group-title { font-weight: 700; font-size: 12px; letter-spacing: .03em; margin-bottom: 4px; }
      .job { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; }
      .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; }
      .src { font-weight: 600; }
      .sub { color: #888; font-size: 12px; word-break: break-word; }
      .err { color: #dc2626; font-size: 12px; }
      .pill { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: #eee; color: #333; }
      @media (prefers-color-scheme: dark) { .pill { background: #222; color: #ccc; } }
      /* The panel repaints once a second during a countdown, so a 1s spin that
         restarts each repaint reads as a continuous rotation; the glyph also
         swaps per tick as a fallback. */
      .countdown { animation: countdown-pulse 1s ease-in-out infinite; }
      .countdown-clock { display: inline-block; animation: spin 1s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes countdown-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) {
        .countdown, .countdown-clock { animation: none; }
      }
      .summary-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
      .scroll { max-height: 360px; overflow-y: auto; }
      .toast { font-size: 12px; color: #16a34a; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
